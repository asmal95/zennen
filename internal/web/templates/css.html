{{define "css"}}<style>
*{box-sizing:border-box}body{margin:0;background:#0e1621;color:#e8edf3;font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
a{color:#6ab2ff;text-decoration:none}.wrap{max-width:640px;margin:0 auto;padding:12px 14px 60px}
nav{position:sticky;top:0;background:#0e1621ee;padding:10px 0;border-bottom:1px solid #1f2c3d;display:flex;gap:14px;overflow-x:auto;font-size:15px}
nav b{color:#fff}h1{font-size:20px}h2{font-size:18px;border-bottom:1px solid #1f2c3d;padding-bottom:6px}
.day{margin:18px 0}.note{background:#17212b;border-radius:10px;padding:10px 12px;margin:10px 0}
.note .t{color:#7f91a5;font-size:13px}.note blockquote{margin:8px 0;padding-left:10px;border-left:3px solid #2b5278;color:#cfd9e4}
.blk{margin:4px 0}.asp{color:#7f91a5;font-size:13px}
.energy{color:#ff8a80}.muted{color:#7f91a5}.big{font-size:22px;letter-spacing:2px}
form.s{display:flex;gap:8px;margin:12px 0}input[type=text]{flex:1;background:#17212b;border:1px solid #2b5278;color:#fff;border-radius:8px;padding:10px}
button{background:#2b5278;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
pre.review{white-space:pre-wrap;font:inherit;background:#17212b;border-radius:10px;padding:12px}
.task{padding:8px 0;border-bottom:1px solid #1f2c3d}.task.done{color:#7f91a5}
.tl-month{color:#6ab2ff}.tl{position:relative;margin-left:8px;padding-left:18px;border-left:2px solid #1f2c3d}
.tl-day{position:relative;margin:16px 0}.tl-dot{position:absolute;left:-25px;top:4px;width:12px;height:12px;border-radius:50%;background:#2b5278;border:2px solid #6ab2ff}
.tl-head{font-weight:bold;margin-bottom:8px}.tl-item{background:#17212b;border-radius:0 10px 10px 0;padding:10px 12px;margin:10px 0;border-left:3px solid #78909c}
.tr-root{font-weight:bold;margin:14px 0 4px;color:#ffd54f}ul.tr{list-style:none;margin:0 0 8px;padding-left:18px;border-left:2px solid #1f2c3d}
ul.tr li{margin:8px 0}
</style>{{end}}
