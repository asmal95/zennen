{{define "tasks"}}<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Задачи</title>{{template "css"}}</head><body><div class="wrap">{{template "nav"}}
<h1>✅ Открытые ({{len .Open}})</h1>
<form class="s" method="post" action="/tasks/new"><input type="text" name="text" placeholder="Новая задача…" maxlength="300"><button>Добавить</button></form>
{{range .Open}}<div class="task">#{{.ID}} — {{.Text}}{{if .Due}} <span class="muted">({{.Due}})</span>{{end}}
<form method="post" action="/tasks/close" style="display:inline"><input type="hidden" name="id" value="{{.ID}}"><button>✓</button></form></div>{{else}}<p class="muted">Открытых задач нет 🎉</p>{{end}}
<h2>Выполненные за 30 дней ({{len .Done}})</h2>
{{range .Done}}<div class="task done">#{{.ID}} — {{.Text}}</div>{{end}}
</div></body></html>{{end}}
