{{define "search"}}<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поиск</title>{{template "css"}}</head><body><div class="wrap">{{template "nav"}}
<h1>🔍 Поиск</h1>
<form class="s" method="get"><input type="text" name="q" value="{{.Q}}" placeholder="слово или фраза…"><button>Найти</button></form>
{{if .Found}}
{{range .Rows}}<div class="note"><div class="t">{{.Day}} · {{.Aspect}}</div><div>{{.Content}}</div></div>{{else}}<p class="muted">Ничего не нашлось.</p>{{end}}
{{end}}
</div></body></html>{{end}}
